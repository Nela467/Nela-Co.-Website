<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Feed - Nela & Co.</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fce4ec; /* light pink background */
        }

        /* Sidebar */
        .sidebar {
            width: 200px;
            background-color: #ffffff;
            height: 100vh;
            padding-top: 40px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            border-right: 1px solid rgba(0,0,0,0.05);
        }

        .sidebar button {
            border: none;
            background: none;
            padding: 15px;
            margin: 5px 10px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.3s, color 0.3s;
        }

        .sidebar button:hover {
            background-color: rgba(0,0,0,0.05);
            color: #1abc9c;
        }

        /* Main content */
        .main-content {
            margin-left: 200px; /* same as sidebar width */
            padding: 20px;
        }

        .iframe-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        iframe {
            width: 100%;
            height: 800px;
            border: none;
        }

        .company-name {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <button onclick="document.getElementById('feed').scrollIntoView({behavior:'smooth'})">Community Feed</button>
        <button onclick="location.href='about.html'">About Us</button>
        <button onclick="location.href='recipes.html'">Recipes</button>
        <button onclick="location.href='wellness.html'">Wellness</button>
        <button onclick="location.href='shop.html'">Shop</button>
        <button onclick="location.href='workouts.html'">Workouts</button>
        <button onclick="location.href='contact.html'">Contact</button>
    </div>

    <!-- Main content -->
    <div class="main-content">
        <div class="company-name">NELA & CO. - COMMUNITY FEED</div>

        <div id="feed" class="iframe-container">
            <iframe src="https://bettergram-izfvgi41.bettermode.io" title="Community Feed"></iframe>
        </div>
    </div>
</body>
</html>
