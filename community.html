<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nela & Co. - Community Feed</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      min-height: 100vh;
      background-color: #ffe6ec; /* soft pink background */
    }

    /* Sidebar */
    .sidebar {
      width: 200px;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      padding-top: 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
    }

    .sidebar button {
      background-color: transparent;
      color: #2c3e50;
      border: none;
      padding: 15px 20px;
      margin: 5px 0;
      cursor: pointer;
      text-align: left;
      font-size: 16px;
      transition: 0.3s;
    }

    .sidebar button:hover {
      background-color: #ffb6c1;
      color: white;
    }

    /* Main content */
    .main {
      flex: 1;
      padding: 60px 40px;
      text-align: center;
    }

    h1 {
      color: #2c3e50;
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 18px;
      max-width: 700px;
      margin: 0 auto 30px auto;
    }

    /* Forum embed */
    iframe {
      width: 100%;
      height: 800px;
      border: none;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
    }

    /* Fallback button if embed not working */
    .forum-link {
      display: inline-block;
      background-color: #ffb6c1;
      color: white;
      padding: 14px 30px;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
      transition: background 0.3s;
    }

    .forum-link:hover {
      background-color: #ff99ac;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <a href="about.html"><button>About Us</button></a>
    <a href="recipes.html"><button>Recipes</button></a>
    <a href="community.html"><button>Community Feed</button></a>
    <a href="wellness.html"><button>Wellness</button></a>
    <a href="shop.html"><button>Shop</button></a>
    <a href="workouts.html"><button>At Home Workouts</button></a>
    <a href="cart.html"><button>Cart</button></a>
    <a href="contact.html"><button>Contact Me</button></a>
  </div>

  <!-- Main Content -->
  <div class="main">
    <h1>Our Community Feed</h1>
    <p>Share your stories, ask questions, and connect with others on your wellness journey.  
    Be part of a supportive and empowering space where balance meets growth.</p>

    <!-- Embed Flarum forum -->
    <iframe src="https://nelacommunity.flarum.cloud"></iframe>

    <!-- Backup link (in case iframe doesn't load) -->
    <a href="https://nelacommunity.flarum.cloud" target="_blank" class="forum-link">
      Visit Full Community Forum
    </a>
  </div>

</body>
</html>
