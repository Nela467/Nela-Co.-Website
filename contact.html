<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Nela & Co.</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fce4ec; /* light pink background */
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 200px;
            background-color: #2c3e50; /* navy color */
            display: flex;
            flex-direction: column;
            padding-top: 20px;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .sidebar button {
            background-color: #34495e;
            color: #fff;
            border: none;
            padding: 15px 20px;
            margin: 5px 0;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: 0.3s;
        }

        .sidebar button:hover {
            background-color: #1abc9c;
        }

        /* Main content */
        .main-content {
            flex: 1;
            padding: 50px 30px;
        }

        h2 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255,255,255,0.9);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        input, textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        textarea {
            min-height: 100px;
        }

        button.submit-btn {
            background-color: #1abc9c;
            color: #fff;
            border: none;
            padding: 12px 0;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.submit-btn:hover {
            background-color: #16a085;
        }

        .email-link {
            text-align: center;
            margin-top: 24px;
            color: #34495e;
        }

        .email-link a {
            color: #1abc9c;
            text-decoration: none;
        }

        .email-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <button onclick="location.href='about.html'">About Us</button>
        <button onclick="location.href='recipes.html'">Recipes</button>
        <button onclick="window.open('https://bettergram-izfvgi41.bettermode.io', '_blank')">Community Feed</button>
        <button onclick="location.href='wellness.html'">Wellness</button>
        <button onclick="location.href='shop.html'">Shop</button>
        <button onclick="location.href='workouts.html'">At Home Workouts</button>
        <button onclick="location.href='cart.html'">Cart</button>
        <button onclick="location.href='contact.html'">Contact Me</button>
    </div>

    <!-- Main content -->
    <div class="main-content">
        <h2>Contact Me</h2>

        <div class="container">
            <form action="https://formspree.io/f/xldppvva" method="POST">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" placeholder="Your Message" required></textarea>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>

            <p class="email-link">
                Or email us directly at <a href="mailto:nela.co@protonmail.com">nela.co@protonmail.com</a>
            </p>
        </div>
    </div>

</body>
</html>
