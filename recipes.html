<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes - Nela & Co.</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fce4ec; /* light pink */
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 200px;
            background-color: #2c3e50; /* navy color */
            display: flex;
            flex-direction: column;
            padding-top: 20px;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .sidebar button {
            background-color: #34495e;
            color: #fff;
            border: none;
            padding: 15px 20px;
            margin: 5px 0;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: 0.3s;
        }

        .sidebar button:hover {
            background-color: #1abc9c;
        }

        /* Main content */
        .main-content {
            flex: 1;
            padding: 50px 30px;
        }

        h2 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .grid-item {
            background-color: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .grid-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .grid-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .grid-item h3 {
            padding: 15px;
            font-size: 20px;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <button onclick="location.href='about.html'">About Us</button>
        <button onclick="location.href='recipes.html'">Recipes</button>
        <button onclick="window.open('https://bettergram-izfvgi41.bettermode.io', '_blank')">Community Feed</button>
        <button onclick="location.href='wellness.html'">Wellness</button>
        <button onclick="location.href='shop.html'">Shop</button>
        <button onclick="location.href='workouts.html'">At Home Workouts</button>
        <button onclick="location.href='cart.html'">Cart</button>
        <button onclick="location.href='contact.html'">Contact Me</button>
    </div>

    <!-- Main content -->
    <div class="main-content">
        <h2>Recipes</h2>

        <div class="grid">
            <a href="breakfast.html" class="grid-item">
                <img src="breakfast.jpg" alt="Breakfast">
                <h3>Breakfast</h3>
            </a>

            <a href="lunch.html" class="grid-item">
                <img src="lunch.jpg" alt="Lunch & Dinner">
                <h3>Lunch & Dinner</h3>
            </a>

            <a href="desserts.html" class="grid-item">
                <img src="dessert.jpg" alt="Desserts">
                <h3>Desserts</h3>
            </a>

            <a href="macro.html" class="grid-item">
                <img src="macro.jpg" alt="Macro Breakdown">
                <h3>Macro Breakdown & Balanced Eating</h3>
            </a>
        </div>
    </div>

</body>
</html>
