<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Nela & Co.</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fce4ec; /* light pink */
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 200px;
            background-color: #2c3e50; /* navy color */
            display: flex;
            flex-direction: column;
            padding-top: 20px;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .sidebar button {
            background-color: #34495e;
            color: #fff;
            border: none;
            padding: 15px 20px;
            margin: 5px 0;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: 0.3s;
        }

        .sidebar button:hover {
            background-color: #1abc9c;
        }

        /* Main content */
        .main-content {
            flex: 1;
            padding: 50px 30px;
        }

        h2 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .cart-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .cart-item {
            background-color: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .cart-item h3 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .cart-item p {
            color: #444;
            margin-bottom: 15px;
        }

        .cart-item button {
            background-color: #1abc9c;
            color: #fff;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .cart-item button:hover {
            background-color: #16a085;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <button onclick="location.href='about.html'">About Us</button>
        <button onclick="location.href='recipes.html'">Recipes</button>
        <button onclick="window.open('https://bettergram-izfvgi41.bettermode.io', '_blank')">Community Feed</button>
        <button onclick="location.href='wellness.html'">Wellness</button>
        <button onclick="location.href='shop.html'">Shop</button>
        <button onclick="location.href='workouts.html'">At Home Workouts</button>
        <button onclick="location.href='cart.html'">Cart</button>
        <button onclick="location.href='contact.html'">Contact Me</button>
    </div>

    <!-- Main content -->
    <div class="main-content">
        <h2>Your Cart</h2>

        <div class="cart-items">
            <div class="cart-item">
                <h3>Organic Protein Powder</h3>
                <p>1 kg – €45.00</p>
                <button>Remove</button>
            </div>

            <div class="cart-item">
                <h3>Yoga Mat</h3>
                <p>Eco-friendly, non-slip – €25.00</p>
                <button>Remove</button>
            </div>

            <div class="cart-item">
                <h3>Wellness Cookbook</h3>
                <p>Healthy recipes for balanced living – €20.00</p>
                <button>Remove</button>
            </div>
        </div>
    </div>

</body>
</html>
